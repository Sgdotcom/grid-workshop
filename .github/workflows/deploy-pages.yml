# Build and publish to GitHub Pages on every push to main.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build
        env:
          # /<repo>/ for project Pages (set by GITHUB_REPOSITORY in Actions)
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Cloudflare Worker URL for shared live room (repo variable or secret)
          VITE_LIVE_SESSION_URL: ${{ vars.VITE_LIVE_SESSION_URL || secrets.VITE_LIVE_SESSION_URL }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
